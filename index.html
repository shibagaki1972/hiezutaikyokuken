<title>日吉津太極拳 集金アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F4EE;
    --surface:#FFFFFF;
    --border:#E4DFD3;
    --ink:#22314A;
    --ink-soft:#65707E;
    --accent:#3F6659;
    --accent-strong:#2D4A40;
    --accent-soft:#E4EEE9;
    --alert:#B84B32;
    --alert-soft:#F7E4DD;
    --success:#4F7A55;
    --success-soft:#E9F1E9;
    --radius:14px;
    --radius-sm:8px;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark){
      --bg:#161F2E;
      --surface:#1F2C40;
      --border:#334158;
      --ink:#EEEDE6;
      --ink-soft:#AAB4C4;
      --accent:#7FBFA8;
      --accent-strong:#9CD3BE;
      --accent-soft:#22392F;
      --alert:#E38468;
      --alert-soft:#402721;
      --success:#8FC49A;
      --success-soft:#213524;
    }
  }
  html[data-theme="dark"]{
    --bg:#161F2E; --surface:#1F2C40; --border:#334158; --ink:#EEEDE6; --ink-soft:#AAB4C4;
    --accent:#7FBFA8; --accent-strong:#9CD3BE; --accent-soft:#22392F;
    --alert:#E38468; --alert-soft:#402721; --success:#8FC49A; --success-soft:#213524;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif;
    font-size:17px;
    line-height:1.6;
    -webkit-tap-highlight-color:transparent;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  #app-shell{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    min-height:100%;
    display:flex;
    flex-direction:column;
    position:relative;
    background:var(--bg);
  }
  .topbar{
    position:sticky;
    top:0;
    z-index:5;
    background:var(--bg);
    padding:18px 20px 10px;
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid transparent;
  }
  .topbar h1{
    font-size:21px;
    font-weight:700;
    margin:0;
    letter-spacing:.02em;
  }
  .topbar .back-btn{
    background:none;
    border:none;
    color:var(--ink);
    font-size:22px;
    padding:4px 8px 4px 0;
    cursor:pointer;
    line-height:1;
  }
  .content{
    flex:1;
    padding:6px 20px 110px;
    overflow-x:hidden;
  }
  .brandmark{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brandmark .mark{
    width:34px; height:34px;
    border-radius:9px;
    object-fit:cover;
    border:1px solid var(--border);
    flex:none;
  }
  .bottomnav{
    position:sticky;
    bottom:0;
    z-index:10;
    display:flex;
    background:var(--surface);
    border-top:1px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  }
  .nav-btn{
    flex:1;
    background:none;
    border:none;
    color:var(--ink-soft);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    padding:8px 2px;
    font-family:inherit;
    font-size:12.5px;
    border-radius:10px;
    cursor:pointer;
  }
  .nav-btn .ic{ font-size:22px; line-height:1; }
  .nav-btn.active{ color:var(--accent-strong); font-weight:700; background:var(--accent-soft); }

  .section-title{
    font-size:15.5px;
    font-weight:700;
    color:var(--ink-soft);
    margin:22px 0 10px;
  }
  .section-title:first-child{ margin-top:8px; }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:12px;
  }
  .card.tight{ padding:12px 16px; }
  .accent-bar{
    border-left:6px solid var(--border);
    padding-left:14px;
  }
  .accent-bar.alert{ border-left-color:var(--alert); }
  .accent-bar.success{ border-left-color:var(--success); }
  .accent-bar.neutral{ border-left-color:var(--ink-soft); opacity:.85; }

  .shortcut{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    width:100%;
    background:none;
    border:none;
    font-family:inherit;
    text-align:left;
    cursor:pointer;
    padding:2px 0;
    color:var(--ink);
  }
  .shortcut .label{ font-size:16px; font-weight:500; }
  .shortcut .count{ font-size:22px; font-weight:900; color:var(--alert); white-space:nowrap; }
  .shortcut .chev{ color:var(--ink-soft); font-size:18px; margin-left:6px; }

  .empty-state{
    text-align:center;
    padding:34px 14px;
    color:var(--ink-soft);
  }
  .empty-state .big{ font-size:38px; margin-bottom:8px; }

  .menu-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .menu-tile{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px 14px;
    text-align:center;
    cursor:pointer;
    font-family:inherit;
    color:var(--ink);
  }
  .menu-tile .ic{ font-size:30px; display:block; margin-bottom:8px; }
  .menu-tile .t{ font-size:15.5px; font-weight:700; }

  .stat-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin:6px 0 4px;
  }
  .stat{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:12px 6px;
    text-align:center;
  }
  .stat .n{ font-size:20px; font-weight:900; }
  .stat .l{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .stat.alert .n{ color:var(--alert); }
  .stat.success .n{ color:var(--success); }

  .money-row{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:8px 0; border-bottom:1px solid var(--border);
    font-size:15px;
  }
  .money-row:last-child{ border-bottom:none; }
  .money-row .v{ font-weight:700; font-size:17px; }
  .money-row.alert .v{ color:var(--alert); }
  .money-row.success .v{ color:var(--success); }

  .tabs{
    display:flex;
    gap:8px;
    margin:14px 0 12px;
  }
  .tab-btn{
    flex:1;
    padding:12px 6px;
    border-radius:10px;
    border:1.5px solid var(--border);
    background:var(--surface);
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    color:var(--ink-soft);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .tab-btn.active{ border-color:var(--ink); color:var(--ink); }
  .tab-btn.active.alert{ border-color:var(--alert); color:var(--alert); background:var(--alert-soft); }
  .tab-btn .n{ font-weight:900; }

  .month-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
    margin-bottom:6px;
  }
  .month-cell{
    padding:14px 4px;
    text-align:center;
    border-radius:10px;
    border:1.5px solid var(--border);
    background:var(--surface);
    font-family:inherit;
    cursor:pointer;
    color:var(--ink);
  }
  .month-cell .m{ font-size:15px; font-weight:700; }
  .month-cell .s{ font-size:11px; margin-top:3px; color:var(--ink-soft); }
  .month-cell.alert{ border-color:var(--alert); background:var(--alert-soft); }
  .month-cell.alert .s{ color:var(--alert); font-weight:700; }
  .month-cell.success{ border-color:var(--success); background:var(--success-soft); }
  .month-cell.success .s{ color:var(--success); font-weight:700; }
  .year-tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .year-tab{
    padding:9px 16px; border-radius:20px; border:1.5px solid var(--border);
    background:var(--surface); font-family:inherit; font-weight:700; font-size:14.5px;
    color:var(--ink-soft); cursor:pointer;
  }
  .year-tab.active{ border-color:var(--ink); color:var(--ink); background:var(--accent-soft); }

  .list-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 4px;
    border-bottom:1px solid var(--border);
  }
  .list-item:last-child{ border-bottom:none; }
  .list-item .chk{
    width:26px; height:26px; flex:none;
    border:2px solid var(--ink-soft);
    border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:900; color:transparent;
    background:var(--surface);
  }
  .list-item.checked .chk{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .list-item .nm{ flex:1; font-size:16.5px; }
  .list-item .meta{ font-size:13.5px; color:var(--ink-soft); white-space:nowrap; }
  .list-item.static{ cursor:default; }
  .list-row-btn{ background:none; border:none; padding:0; margin:0; width:100%; text-align:left; font-family:inherit; cursor:pointer; color:inherit; }

  .undo-btn{
    border:1.5px solid var(--border); background:var(--surface); color:var(--ink-soft);
    font-family:inherit; font-size:12.5px; padding:6px 10px; border-radius:8px; cursor:pointer; flex:none;
  }

  .btn{
    display:block;
    width:100%;
    padding:16px;
    border-radius:12px;
    border:none;
    font-family:inherit;
    font-size:16.5px;
    font-weight:700;
    cursor:pointer;
    background:var(--accent);
    color:#fff;
    text-align:center;
  }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.secondary{ background:var(--surface); color:var(--ink); border:1.5px solid var(--border); }
  .btn.danger{ background:var(--alert); }
  .btn.ghost{ background:none; color:var(--accent-strong); font-weight:700; padding:10px; }
  .btn-row{ display:flex; gap:10px; margin-top:14px; }
  .btn-row .btn{ margin-bottom:0; }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:14.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .field input[type="text"], .field input[type="number"]{
    width:100%;
    padding:14px 14px;
    font-size:17px;
    font-family:inherit;
    border:1.5px solid var(--border);
    border-radius:10px;
    background:var(--surface);
    color:var(--ink);
  }
  .field input:focus, .btn:focus-visible, .nav-btn:focus-visible, .tab-btn:focus-visible, .month-cell:focus-visible, .menu-tile:focus-visible{
    outline:3px solid var(--accent-strong); outline-offset:1px;
  }
  .field .suffix-row{ display:flex; align-items:center; gap:8px; }
  .field .suffix-row .unit{ color:var(--ink-soft); font-size:15px; flex:none; }
  .compute-preview{
    background:var(--accent-soft);
    border-radius:10px;
    padding:14px;
    margin:6px 0 18px;
    text-align:center;
  }
  .compute-preview .amt{ font-size:26px; font-weight:900; color:var(--accent-strong); }
  .compute-preview .lbl{ font-size:13px; color:var(--ink-soft); margin-top:2px; }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(20,24,30,.45);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:100; padding:0;
  }
  .modal{
    background:var(--surface);
    width:100%; max-width:520px;
    border-radius:20px 20px 0 0;
    padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));
    max-height:86vh;
    overflow-y:auto;
  }
  .modal h2{ font-size:19px; margin:0 0 16px; }
  .modal p.desc{ color:var(--ink-soft); font-size:14.5px; margin-top:-8px; margin-bottom:16px; }

  .toast{
    position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%);
    background:var(--ink); color:var(--bg);
    padding:12px 22px; border-radius:30px; font-size:14.5px; font-weight:700;
    z-index:200; opacity:0; pointer-events:none; transition:opacity .25s ease;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; }

  .checklist-scroll{ max-height:44vh; overflow-y:auto; margin-bottom:14px; border:1px solid var(--border); border-radius:10px; padding:2px 12px; }

  .settings-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 2px; border-bottom:1px solid var(--border);
  }
  .settings-row:last-child{ border-bottom:none; }
  .settings-row .t{ font-size:16px; font-weight:500; }
  .settings-row .d{ font-size:13px; color:var(--ink-soft); margin-top:2px; }

  .pill{ display:inline-block; padding:3px 10px; border-radius:20px; font-size:12.5px; font-weight:700; }
  .pill.alert{ background:var(--alert-soft); color:var(--alert); }
  .pill.success{ background:var(--success-soft); color:var(--success); }
  .pill.neutral{ background:var(--accent-soft); color:var(--ink-soft); }

  .complete-banner{
    background:var(--success-soft); color:var(--success);
    border-radius:12px; padding:14px 16px; margin-bottom:14px;
    font-weight:700; font-size:15.5px; text-align:center;
  }
  input[type=file]{ display:none; }
  .subtabs{ display:flex; gap:6px; margin-bottom:14px; }
  .subtab{
    padding:8px 16px; border-radius:20px; border:1.5px solid var(--border);
    background:var(--surface); font-family:inherit; font-size:14px; font-weight:700;
    color:var(--ink-soft); cursor:pointer;
  }
  .subtab.active{ border-color:var(--ink); color:var(--ink); }
</style>
</head>
<body>
<div id="app-shell">
  <div id="topbar" class="topbar"></div>
  <div id="content" class="content"></div>
  <div id="bottomnav" class="bottomnav"></div>
</div>
<div id="modal-root"></div>
<div id="toast" class="toast"></div>

<script>
(function(){
  "use strict";

  /* ---------- storage ---------- */
  var STORAGE_KEY = "hiekozu_taikyoku_shukin_v1";

  function defaultState(){
    return {
      members: [],
      years: {},
      events: [],
      settings: { feePerSession: 750 },
      nextMemberId: 1,
      nextEventId: 1,
      nextGuestId: 1,
      nextParticipantId: 1
    };
  }

  var state = null;
  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ state = JSON.parse(raw); return; }
    }catch(e){}
    state = defaultState();
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ showToast("保存できませんでした"); }
  }

  /* ---------- date helpers ---------- */
  function pad2(n){ return String(n).padStart(2,"0"); }
  function todayParts(){ var d=new Date(); return {y:d.getFullYear(), m:d.getMonth()+1, d:d.getDate()}; }
  function todayYm(){ var t=todayParts(); return t.y+"-"+pad2(t.m); }
  function todayYmd(){ var t=todayParts(); return t.y+"-"+pad2(t.m)+"-"+pad2(t.d); }
  function ymdDisplay(ymd){ if(!ymd) return ""; var p=ymd.split("-"); return p[1]+"/"+p[2]; }
  function ymOf(year,month){ return year+"-"+pad2(month); }
  var MONTH_NAMES = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];

  function ensureYear(year){
    if(!state.years[year]) state.years[year] = {};
  }
  function ensureYearsExist(){
    var y = todayParts().y;
    ensureYear(y);
    ensureYear(y+1);
  }

  /* ---------- member logic ---------- */
  function newMemberId(){ var id = state.nextMemberId++; return id; }
  function addMember(name){
    var m = { id:newMemberId(), name:name, history:[{ym:todayYm(), type:"join"}] };
    state.members.push(m);
    saveState();
    return m;
  }
  function isActiveAt(member, ym){
    var hist = member.history.slice().sort(function(a,b){ return a.ym < b.ym ? -1 : (a.ym>b.ym?1:0); });
    var latest = null;
    for(var i=0;i<hist.length;i++){
      if(hist[i].ym <= ym) latest = hist[i]; else break;
    }
    return !!latest && latest.type === "join";
  }
  function activeMembersAt(ym){
    return state.members.filter(function(m){ return isActiveAt(m, ym); });
  }
  function withdrawMember(id){
    var m = state.members.find(function(x){ return x.id===id; });
    if(!m) return;
    m.history.push({ym: todayYm(), type:"withdraw"});
    saveState();
  }
  function rejoinMember(id){
    var m = state.members.find(function(x){ return x.id===id; });
    if(!m) return;
    m.history.push({ym: todayYm(), type:"join"});
    saveState();
  }
  function memberName(id){
    var m = state.members.find(function(x){ return x.id===id; });
    return m ? m.name : "(不明)";
  }

  /* ---------- month logic ---------- */
  function getMonth(year, month){
    ensureYear(year);
    return state.years[year][month] || null;
  }
  function setPracticeCount(year, month, count, fee){
    ensureYear(year);
    var existing = state.years[year][month];
    state.years[year][month] = {
      practiceCount: count,
      feePerSession: fee,
      paid: existing ? existing.paid : {}
    };
    saveState();
  }
  function monthAmountPerPerson(md){ return md.practiceCount * md.feePerSession; }
  function monthMarkPaid(year, month, ids){
    var md = getMonth(year, month); if(!md) return;
    ids.forEach(function(id){ md.paid[id] = { date: todayYmd() }; });
    saveState();
  }
  function monthUnmarkPaid(year, month, id){
    var md = getMonth(year, month); if(!md) return;
    delete md.paid[id];
    saveState();
  }
  function monthUnpaidMembers(year, month){
    var md = getMonth(year, month); if(!md) return [];
    var active = activeMembersAt(ymOf(year,month));
    return active.filter(function(m){ return !md.paid[m.id]; });
  }
  function monthPaidEntries(year, month){
    var md = getMonth(year, month); if(!md) return [];
    var active = activeMembersAt(ymOf(year,month));
    var activeIds = {}; active.forEach(function(m){ activeIds[m.id]=true; });
    var out = [];
    Object.keys(md.paid).forEach(function(idStr){
      var id = Number(idStr);
      out.push({ id:id, name: memberName(id), date: md.paid[idStr].date, stillActive: !!activeIds[id] });
    });
    out.sort(function(a,b){ return a.date < b.date ? -1 : (a.date>b.date?1:0); });
    return out;
  }

  /* ---------- event logic ---------- */
  function addEvent(name, amount){
    var ev = { id: state.nextEventId++, name:name, amount:amount, participants:[], paid:{} };
    state.events.push(ev);
    saveState();
    return ev;
  }
  function getEvent(id){ return state.events.find(function(e){ return e.id===id; }); }
  function eventAddMembers(eventId, memberIds){
    var ev = getEvent(eventId); if(!ev) return;
    var existingMemberIds = {};
    ev.participants.forEach(function(p){ if(p.type==="member") existingMemberIds[p.memberId]=true; });
    memberIds.forEach(function(mid){
      if(existingMemberIds[mid]) return;
      ev.participants.push({ id: state.nextParticipantId++, type:"member", memberId: mid });
    });
    saveState();
  }
  function eventAddGuest(eventId, name){
    var ev = getEvent(eventId); if(!ev) return;
    var n = name && name.trim() ? name.trim() : ("ゲスト" + (state.nextGuestId));
    state.nextGuestId++;
    ev.participants.push({ id: state.nextParticipantId++, type:"guest", name:n });
    saveState();
  }
  function eventRemoveParticipant(eventId, pid){
    var ev = getEvent(eventId); if(!ev) return;
    ev.participants = ev.participants.filter(function(p){ return p.id!==pid; });
    delete ev.paid[pid];
    saveState();
  }
  function participantName(ev, p){
    return p.type==="member" ? memberName(p.memberId) : p.name;
  }
  function eventMarkPaid(eventId, ids){
    var ev = getEvent(eventId); if(!ev) return;
    ids.forEach(function(id){ ev.paid[id] = { date: todayYmd() }; });
    saveState();
  }
  function eventUnmarkPaid(eventId, id){
    var ev = getEvent(eventId); if(!ev) return;
    delete ev.paid[id];
    saveState();
  }
  function eventUnpaidParticipants(ev){
    return ev.participants.filter(function(p){ return !ev.paid[p.id]; });
  }
  function eventPaidEntries(ev){
    var out = [];
    Object.keys(ev.paid).forEach(function(idStr){
      var id = Number(idStr);
      var p = ev.participants.find(function(x){ return x.id===id; });
      if(!p) return;
      out.push({ id:id, name: participantName(ev,p), date: ev.paid[idStr].date });
    });
    out.sort(function(a,b){ return a.date < b.date ? -1 : (a.date>b.date?1:0); });
    return out;
  }

  /* ---------- UI state (not persisted) ---------- */
  var ui = {
    route: "home",
    year: null,
    month: null,
    monthTab: "unpaid",
    eventId: null,
    eventTab: "participants",
    memberSubtab: "active",
    monthSelected: {},
    eventSelected: {},
    monthEditing: false
  };

  function fmtYen(n){ return n.toLocaleString("ja-JP") + "円"; }

  /* ---------- toast ---------- */
  var toastTimer = null;
  function showToast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2200);
  }

  /* ---------- modal ---------- */
  function openModal(html){
    var root = document.getElementById("modal-root");
    root.innerHTML = '<div class="modal-backdrop" data-action="modal:close"><div class="modal" id="modal-inner">'+html+'</div></div>';
    document.getElementById("modal-inner").addEventListener("click", function(e){ e.stopPropagation(); });
  }
  function closeModal(){
    document.getElementById("modal-root").innerHTML = "";
  }

  function confirmModal(title, desc, confirmLabel, danger, onConfirm){
    openModal(
      '<h2>'+esc(title)+'</h2>'+
      (desc ? '<p class="desc">'+esc(desc)+'</p>' : '') +
      '<div class="btn-row">'+
        '<button class="btn secondary" data-action="modal:close">キャンセル</button>'+
        '<button class="btn '+(danger?'danger':'')+'" id="confirm-yes-btn">'+esc(confirmLabel)+'</button>'+
      '</div>'
    );
    document.getElementById("confirm-yes-btn").addEventListener("click", function(){
      closeModal();
      onConfirm();
    });
  }

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  /* ---------- rendering ---------- */
  function render(){
    renderTopbar();
    renderContent();
    renderBottomNav();
  }

  function renderTopbar(){
    var titles = {
      home: "日吉津太極拳", members: "メンバー管理", months: "毎月の集金",
      monthDetail: MONTH_NAMES[ui.month-1] + "の集金", events: "イベント集金",
      eventDetail: (ui.eventId!=null && getEvent(ui.eventId)) ? getEvent(ui.eventId).name : "イベント",
      settings: "設定"
    };
    var showBack = ui.route !== "home";
    var back = showBack ? '<button class="back-btn" data-action="nav:back" aria-label="戻る">←</button>' : '';

  function navBackTarget(route){
    if(route==="monthDetail") return "months";
    if(route==="eventDetail") return "events";
    return "home";
  }

  function renderBottomNav(){
    var items = [
      {key:"home", ic:"🏠", label:"ホーム"},
      {key:"members", ic:"👥", label:"メンバー"},
      {key:"months", ic:"🗓️", label:"毎月の集金"},
      {key:"events", ic:"🏆", label:"イベント"},
      {key:"settings", ic:"⚙️", label:"設定"}
    ];
    var activeGroup = {home:"home", members:"members", months:"months", monthDetail:"months", events:"events", eventDetail:"events", settings:"settings"}[ui.route];
    var html = items.map(function(it){
      var cls = "nav-btn" + (activeGroup===it.key ? " active":"");
      return '<button class="'+cls+'" data-action="nav:'+it.key+'"><span class="ic">'+it.ic+'</span><span>'+it.label+'</span></button>';
    }).join("");
    document.getElementById("bottomnav").innerHTML = html;
  }

  function renderContent(){
    var el = document.getElementById("content");
    if(ui.route==="home") el.innerHTML = renderHome();
    else if(ui.route==="members") el.innerHTML = renderMembers();
    else if(ui.route==="months") el.innerHTML = renderMonths();
    else if(ui.route==="monthDetail") el.innerHTML = renderMonthDetail();
    else if(ui.route==="events") el.innerHTML = renderEvents();
    else if(ui.route==="eventDetail") el.innerHTML = renderEventDetail();
    else if(ui.route==="settings") el.innerHTML = renderSettings();
  }

  /* ---- HOME ---- */
  function renderHome(){
    var shortcuts = [];
    var years = Object.keys(state.years).map(Number).sort(function(a,b){return b-a;});
    var thisYm = todayYm();
    years.forEach(function(y){
      var months = Object.keys(state.years[y]).map(Number).sort(function(a,b){return b-a;});
      months.forEach(function(m){
        var ym = ymOf(y,m);
        var unpaid = monthUnpaidMembers(y,m);
        if(unpaid.length>0){
          shortcuts.push({ type:"month", year:y, month:m, count:unpaid.length, sortKey: ym });
        }
      });
    });
    shortcuts.sort(function(a,b){ return a.sortKey < b.sortKey ? 1 : -1; });
    state.events.forEach(function(ev){
      var unpaid = eventUnpaidParticipants(ev);
      if(ev.participants.length>0 && unpaid.length>0){
        shortcuts.push({ type:"event", eventId:ev.id, count:unpaid.length, name:ev.name });
      }
    });

    var body = "";
    body += '<div class="section-title">未払い状況</div>';
    if(shortcuts.length===0){
      body += '<div class="card"><div class="empty-state"><div class="big">☯️</div>未払いはありません</div></div>';
    } else {
      var rows = shortcuts.map(function(s){
        if(s.type==="month"){
          var label = s.year + "年 " + MONTH_NAMES[s.month-1] + "の未払い";
          return '<button class="shortcut" data-action="shortcut:month" data-year="'+s.year+'" data-month="'+s.month+'">'+
            '<span class="label">'+esc(label)+'</span>'+
            '<span style="display:flex;align-items:center;"><span class="count">'+s.count+'人</span><span class="chev">›</span></span>'+
          '</button>';
        } else {
          var label2 = s.name + "の未払い";
          return '<button class="shortcut" data-action="shortcut:event" data-eventid="'+s.eventId+'">'+
            '<span class="label">'+esc(label2)+'</span>'+
            '<span style="display:flex;align-items:center;"><span class="count">'+s.count+'人</span><span class="chev">›</span></span>'+
          '</button>';
        }
      });
      body += '<div class="card accent-bar alert">' + rows.join('<div style="height:1px;background:var(--border);margin:10px 0;"></div>') + '</div>';
    }

    body += '<div class="section-title">メニュー</div>';
    body += '<div class="menu-grid">'+
      '<button class="menu-tile" data-action="nav:members"><span class="ic">👥</span><span class="t">メンバー管理</span></button>'+
      '<button class="menu-tile" data-action="nav:months"><span class="ic">🗓️</span><span class="t">毎月の集金</span></button>'+
      '<button class="menu-tile" data-action="nav:events"><span class="ic">🏆</span><span class="t">イベント集金</span></button>'+
      '<button class="menu-tile" data-action="nav:settings"><span class="ic">⚙️</span><span class="t">設定</span></button>'+
    '</div>';

    return body;
  }

  /* ---- MEMBERS ---- */
  function renderMembers(){
    var thisYm = todayYm();
    var active = state.members.filter(function(m){ return isActiveAt(m, thisYm); });
    var withdrawn = state.members.filter(function(m){ return !isActiveAt(m, thisYm) && m.history.length>0; });

    var html = '';
    html += '<div class="subtabs">'+
      '<button class="subtab '+(ui.memberSubtab==="active"?"active":"")+'" data-action="member:subtab" data-tab="active">在籍中（'+active.length+'）</button>'+
      '<button class="subtab '+(ui.memberSubtab==="withdrawn"?"active":"")+'" data-action="member:subtab" data-tab="withdrawn">退会済み（'+withdrawn.length+'）</button>'+
    '</div>';

    html += '<div class="card">';
    var list = ui.memberSubtab==="active" ? active : withdrawn;
    if(list.length===0){
      html += '<div class="empty-state">'+(ui.memberSubtab==="active" ? "在籍中のメンバーがいません" : "退会済みのメンバーはいません")+'</div>';
    } else {
      html += list.map(function(m){
        var action = ui.memberSubtab==="active" ? "member:withdrawConfirm" : "member:rejoinConfirm";
        return '<div class="list-item"><button class="list-row-btn" data-action="'+action+'" data-id="'+m.id+'" style="display:flex;width:100%;align-items:center;"><span class="nm">'+esc(m.name)+'</span><span class="meta">'+(ui.memberSubtab==="active"?"退会する":"再入会する")+' ›</span></button></div>';
      }).join("");
    }
    html += '</div>';

    html += '<button class="btn" data-action="member:addOpen" style="margin-top:16px;">＋ メンバーを追加</button>';
    return html;
  }

  /* ---- MONTHS (year/month picker) ---- */
  function renderMonths(){
    var years = Object.keys(state.years).map(Number).sort(function(a,b){return a-b;});
    if(ui.year===null || years.indexOf(ui.year)===-1) ui.year = todayParts().y;

    var html = '<div class="year-tabs">' + years.map(function(y){
      return '<button class="year-tab '+(y===ui.year?"active":"")+'" data-action="year:select" data-year="'+y+'">'+y+'年</button>';
    }).join("") + '</div>';

    html += '<div class="month-grid">';
    for(var m=1;m<=12;m++){
      var md = getMonth(ui.year, m);
      var cls = "month-cell";
      var sub = "未設定";
      if(md){
        var unpaid = monthUnpaidMembers(ui.year, m).length;
        if(unpaid>0){ cls += " alert"; sub = "未払い"+unpaid+"人"; }
        else { cls += " success"; sub = "集金完了"; }
      }
      html += '<button class="'+cls+'" data-action="month:open" data-year="'+ui.year+'" data-month="'+m+'"><div class="m">'+MONTH_NAMES[m-1]+'</div><div class="s">'+sub+'</div></button>';
    }
    html += '</div>';
    return html;
  }

  function renderMonthDetail(){
    var year = ui.year, month = ui.month;
    var md = getMonth(year, month);

    if(!md || ui.monthEditing){
      var defFee = md ? md.feePerSession : state.settings.feePerSession;
      var defCount = md ? md.practiceCount : 1;
      var heading = md ? "練習回数を変更する" : "この月の練習回数を入力してください";
      return '<div class="card">'+
        '<div class="section-title" style="margin-top:0;">'+heading+'</div>'+
        '<form id="practice-form">'+
          '<div class="field"><label>練習回数</label><div class="suffix-row"><input type="number" min="0" step="1" id="pf-count" value="'+defCount+'" required><span class="unit">回</span></div></div>'+
          '<div class="field"><label>1回あたりの金額</label><div class="suffix-row"><input type="number" min="0" step="10" id="pf-fee" value="'+defFee+'" required><span class="unit">円</span></div></div>'+
          '<div id="pf-preview" class="compute-preview"><div class="amt">'+fmtYen(defCount*defFee)+'</div><div class="lbl">1人あたりの集金額</div></div>'+
          '<div class="btn-row">'+
          (md ? '<button type="button" class="btn secondary" data-action="month:editCancel">キャンセル</button>' : '')+
          '<button type="submit" class="btn">設定する</button>'+
          '</div>'+
        '</form>'+
      '</div>';
    }

    var active = activeMembersAt(ymOf(year,month));
    var unpaid = monthUnpaidMembers(year, month);
    var paidEntries = monthPaidEntries(year, month);
    var perPerson = monthAmountPerPerson(md);
    var collected = paidEntries.length * perPerson;
    var expected = active.length * perPerson;
    var uncollected = expected - collected;

    var html = "";
    if(active.length>0 && unpaid.length===0){
      html += '<div class="complete-banner">🎉 '+MONTH_NAMES[month-1]+'の集金完了</div>';
    }

    html += '<div class="card tight">'+
      '<div class="money-row"><span>練習回数</span><span class="v">'+md.practiceCount+'回</span></div>'+
      '<div class="money-row"><span>1回あたり</span><span class="v">'+fmtYen(md.feePerSession)+'</span></div>'+
      '<div class="money-row"><span>1人あたりの集金額</span><span class="v">'+fmtYen(perPerson)+'</span></div>'+
      '<button class="btn ghost" data-action="month:editOpen" style="padding:8px 0 0;">練習回数を変更する</button>'+
    '</div>';

    html += '<div class="stat-grid">'+
      '<div class="stat"><div class="n">'+active.length+'</div><div class="l">対象人数</div></div>'+
      '<div class="stat success"><div class="n">'+paidEntries.length+'</div><div class="l">支払い済</div></div>'+
      '<div class="stat alert"><div class="n">'+unpaid.length+'</div><div class="l">未払い</div></div>'+
    '</div>';
    html += '<div class="card tight">'+
      '<div class="money-row"><span>集金予定</span><span class="v">'+fmtYen(expected)+'</span></div>'+
      '<div class="money-row success"><span>集金済</span><span class="v">'+fmtYen(collected)+'</span></div>'+
      '<div class="money-row alert"><span>未集金</span><span class="v">'+fmtYen(uncollected)+'</span></div>'+
    '</div>';

    html += '<div class="tabs">'+
      '<button class="tab-btn '+(ui.monthTab==="unpaid"?"active alert":"")+'" data-action="month:tab" data-tab="unpaid">未払い <span class="n">'+unpaid.length+'</span></button>'+
      '<button class="tab-btn '+(ui.monthTab==="paid"?"active":"")+'" data-action="month:tab" data-tab="paid">支払い済 <span class="n">'+paidEntries.length+'</span></button>'+
    '</div>';

    html += '<div class="card tight">';
    if(ui.monthTab==="unpaid"){
      if(unpaid.length===0){
        html += '<div class="empty-state">未払いのメンバーはいません</div>';
      } else {
        html += unpaid.map(function(m){
          var checked = !!ui.monthSelected[m.id];
          return '<div class="list-item '+(checked?"checked":"")+'" data-action="month:toggle" data-id="'+m.id+'"><span class="chk">✓</span><span class="nm">'+esc(m.name)+'</span></div>';
        }).join("");
        html += '<div class="btn-row" style="margin-top:14px;">'+
          '<button class="btn secondary" data-action="month:selectAll">全員選択</button>'+
          '<button class="btn" data-action="month:markPaid">支払い済にする</button>'+
        '</div>';
      }
    } else {
      if(paidEntries.length===0){
        html += '<div class="empty-state">支払い済のメンバーはいません</div>';
      } else {
        html += paidEntries.map(function(e){
          return '<div class="list-item"><span class="nm">'+esc(e.name)+(e.stillActive?"":'<span class="pill neutral" style="margin-left:8px;">退会済</span>')+'</span><span class="meta" style="margin-right:8px;">'+ymdDisplay(e.date)+'</span><button class="undo-btn" data-action="month:unmarkPaid" data-id="'+e.id+'">取り消す</button></div>';
        }).join("");
      }
    }
    html += '</div>';
    return html;
  }

  /* ---- EVENTS ---- */
  function renderEvents(){
    var html = '';
    if(state.events.length===0){
      html += '<div class="card"><div class="empty-state">登録されたイベントがありません</div></div>';
    } else {
      html += '<div class="card">' + state.events.map(function(ev){
        var unpaid = eventUnpaidParticipants(ev);
        var pillHtml = ev.participants.length===0 ? '<span class="pill neutral">参加者未登録</span>' :
          (unpaid.length>0 ? '<span class="pill alert">未払い'+unpaid.length+'人</span>' : '<span class="pill success">集金完了</span>');
        return '<div class="list-item"><button class="list-row-btn" data-action="event:open" data-id="'+ev.id+'" style="display:flex;width:100%;align-items:center;justify-content:space-between;"><span class="nm">'+esc(ev.name)+'</span>'+pillHtml+'</button></div>';
      }).join("") + '</div>';
    }
    html += '<button class="btn" data-action="event:addOpen" style="margin-top:16px;">＋ イベントを追加</button>';
    return html;
  }

  function renderEventDetail(){
    var ev = getEvent(ui.eventId);
    if(!ev){ ui.route="events"; return renderEvents(); }
    var unpaid = eventUnpaidParticipants(ev);
    var paidEntries = eventPaidEntries(ev);

    var html = "";
    html += '<div class="card tight"><div class="money-row"><span>集金金額（1人あたり）</span><span class="v">'+fmtYen(ev.amount)+'</span></div></div>';

    if(ev.participants.length>0 && unpaid.length===0){
      html += '<div class="complete-banner">🎉 '+esc(ev.name)+'の集金完了</div>';
    }

    html += '<div class="tabs">'+
      '<button class="tab-btn '+(ui.eventTab==="participants"?"active":"")+'" data-action="event:tab" data-tab="participants">参加者 <span class="n">'+ev.participants.length+'</span></button>'+
      '<button class="tab-btn '+(ui.eventTab==="unpaid"?"active alert":"")+'" data-action="event:tab" data-tab="unpaid">未払い <span class="n">'+unpaid.length+'</span></button>'+
      '<button class="tab-btn '+(ui.eventTab==="paid"?"active":"")+'" data-action="event:tab" data-tab="paid">支払い済 <span class="n">'+paidEntries.length+'</span></button>'+
    '</div>';

    html += '<div class="card tight">';
    if(ui.eventTab==="participants"){
      if(ev.participants.length===0){
        html += '<div class="empty-state">参加者がいません</div>';
      } else {
        html += ev.participants.map(function(p){
          var nm = participantName(ev,p);
          var tag = p.type==="guest" ? '<span class="pill neutral" style="margin-right:8px;">ゲスト</span>' : '';
          return '<div class="list-item"><span class="nm">'+tag+esc(nm)+'</span><button class="undo-btn" data-action="event:removeParticipantConfirm" data-id="'+p.id+'">削除</button></div>';
        }).join("");
      }
      html += '<div class="btn-row" style="margin-top:14px;">'+
        '<button class="btn secondary" data-action="event:addMembersOpen">メンバーから追加</button>'+
        '<button class="btn secondary" data-action="event:addGuestOpen">ゲストを追加</button>'+
      '</div>';
    } else if(ui.eventTab==="unpaid"){
      if(unpaid.length===0){
        html += '<div class="empty-state">未払いの参加者はいません</div>';
      } else {
        html += unpaid.map(function(p){
          var checked = !!ui.eventSelected[p.id];
          var nm = participantName(ev,p);
          return '<div class="list-item '+(checked?"checked":"")+'" data-action="event:toggle" data-id="'+p.id+'"><span class="chk">✓</span><span class="nm">'+esc(nm)+'</span></div>';
        }).join("");
        html += '<div class="btn-row" style="margin-top:14px;">'+
          '<button class="btn secondary" data-action="event:selectAll">全員選択</button>'+
          '<button class="btn" data-action="event:markPaid">支払い済にする</button>'+
        '</div>';
      }
    } else {
      if(paidEntries.length===0){
        html += '<div class="empty-state">支払い済の参加者はいません</div>';
      } else {
        html += paidEntries.map(function(e){
          return '<div class="list-item"><span class="nm">'+esc(e.name)+'</span><span class="meta" style="margin-right:8px;">'+ymdDisplay(e.date)+'</span><button class="undo-btn" data-action="event:unmarkPaid" data-id="'+e.id+'">取り消す</button></div>';
        }).join("");
        html += '<div class="money-row success" style="margin-top:8px;"><span>集金済 合計</span><span class="v">'+fmtYen(paidEntries.length*ev.amount)+'</span></div>';
      }
    }
    html += '</div>';
    return html;
  }

  /* ---- SETTINGS ---- */
  function renderSettings(){
    var html = "";
    html += '<div class="section-title" style="margin-top:0;">集金金額</div>';
    html += '<div class="card"><form id="fee-form">'+
      '<div class="field"><label>1回あたりの金額（新しい月に適用）</label><div class="suffix-row"><input type="number" min="0" step="10" id="fee-input" value="'+state.settings.feePerSession+'"><span class="unit">円</span></div></div>'+
      '<p class="desc" style="margin-top:-6px;">すでに設定済みの月の金額は変わりません。</p>'+
      '<button type="submit" class="btn secondary">保存する</button>'+
    '</form></div>';

    html += '<div class="section-title">データの引き継ぎ</div>';
    html += '<div class="card">'+
      '<div class="settings-row"><div><div class="t">データを保存する</div><div class="d">機種変更や担当者交代のためのファイルを作成します</div></div></div>'+
      '<button class="btn secondary" data-action="settings:export" style="margin-top:12px;">データを保存する</button>'+
      '<div style="height:18px;"></div>'+
      '<div class="settings-row"><div><div class="t">データを引き継ぐ</div><div class="d">保存したファイルから過去のデータを復元します</div></div></div>'+
      '<button class="btn secondary" data-action="settings:importOpen" style="margin-top:12px;">データを引き継ぐ</button>'+
      '<input type="file" id="import-file-input" accept="application/json,.json,.txt,text/plain">'+
    '</div>';

    html += '<div class="section-title">その他</div>';
    html += '<div class="card"><button class="btn danger" data-action="settings:resetConfirm">すべてのデータを消去する</button></div>';
    return html;
  }

  /* ---------- action handling ---------- */
  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-action]");
    if(!t) return;
    var action = t.getAttribute("data-action");
    handleAction(action, t, e);
  });

  function switchRoute(route){
    ui.route = route;
    ui.monthSelected = {};
    ui.eventSelected = {};
    render();
    window.scrollTo(0,0);
  }

  function handleAction(action, el){
    if(action==="modal:close"){ closeModal(); return; }

    if(action.indexOf("nav:")===0){
      var target = action.split(":")[1];
      if(target==="home"){ switchRoute("home"); }
      else if(target==="members"){ ui.memberSubtab="active"; switchRoute("members"); }
      else if(target==="months"){ switchRoute("months"); }
      else if(target==="events"){ switchRoute("events"); }
      else if(target==="settings"){ switchRoute("settings"); }
      else if(target==="back"){ switchRoute(navBackTarget(ui.route)); }
      return;
    }

    if(action==="shortcut:month"){
      ui.year = Number(el.getAttribute("data-year"));
      ui.month = Number(el.getAttribute("data-month"));
      ui.monthTab = "unpaid";
      ui.monthEditing = false;
      switchRoute("monthDetail");
      return;
    }
    if(action==="shortcut:event"){
      ui.eventId = Number(el.getAttribute("data-eventid"));
      ui.eventTab = "unpaid";
      switchRoute("eventDetail");
      return;
    }

    /* members */
    if(action==="member:subtab"){ ui.memberSubtab = el.getAttribute("data-tab"); render(); return; }
    if(action==="member:addOpen"){
      openModal(
        '<h2>メンバーを追加</h2>'+
        '<form id="add-member-form">'+
          '<div class="field"><label>氏名</label><input type="text" id="am-name" required autofocus></div>'+
          '<button type="submit" class="btn">追加する</button>'+
        '</form>'
      );
      document.getElementById("add-member-form").addEventListener("submit", function(ev2){
        ev2.preventDefault();
        var name = document.getElementById("am-name").value.trim();
        if(!name) return;
        addMember(name);
        closeModal();
        showToast(name + "さんを追加しました");
        render();
      });
      return;
    }
    if(action==="member:withdrawConfirm"){
      var id1 = Number(el.getAttribute("data-id"));
      var nm1 = memberName(id1);
      confirmModal(nm1+"さんを退会させますか？", "今後の集金対象から外れます。過去の記録は保持されます。", "退会する", true, function(){
        withdrawMember(id1);
        showToast(nm1+"さんを退会にしました");
        render();
      });
      return;
    }
    if(action==="member:rejoinConfirm"){
      var id2 = Number(el.getAttribute("data-id"));
      var nm2 = memberName(id2);
      confirmModal(nm2+"さんを再入会させますか？", "今月から集金対象になります。", "再入会する", false, function(){
        rejoinMember(id2);
        showToast(nm2+"さんを再入会にしました");
        render();
      });
      return;
    }

    /* months */
    if(action==="year:select"){ ui.year = Number(el.getAttribute("data-year")); render(); window.scrollTo(0,0); return; }
    if(action==="month:open"){
      ui.year = Number(el.getAttribute("data-year"));
      ui.month = Number(el.getAttribute("data-month"));
      ui.monthTab = "unpaid";
      ui.monthEditing = false;
      switchRoute("monthDetail");
      return;
    }
    if(action==="month:editOpen"){
      ui.monthEditing = true;
      render();
      window.scrollTo(0,0);
      return;
    }
    if(action==="month:editCancel"){
      ui.monthEditing = false;
      render();
      window.scrollTo(0,0);
      return;
    }
    if(action==="month:tab"){ ui.monthTab = el.getAttribute("data-tab"); ui.monthSelected={}; render(); window.scrollTo(0,0); return; }
    if(action==="month:toggle"){
      var mid = Number(el.getAttribute("data-id"));
      if(ui.monthSelected[mid]) delete ui.monthSelected[mid]; else ui.monthSelected[mid]=true;
      render();
      return;
    }
    if(action==="month:selectAll"){
      var unpaidList = monthUnpaidMembers(ui.year, ui.month);
      unpaidList.forEach(function(m){ ui.monthSelected[m.id]=true; });
      render();
      return;
    }
    if(action==="month:markPaid"){
      var ids = Object.keys(ui.monthSelected).map(Number);
      if(ids.length===0) return;
      monthMarkPaid(ui.year, ui.month, ids);
      ui.monthSelected = {};
      showToast(ids.length+"人を支払い済にしました");
      render();
      return;
    }
    if(action==="month:unmarkPaid"){
      var uid = Number(el.getAttribute("data-id"));
      monthUnmarkPaid(ui.year, ui.month, uid);
      render();
      return;
    }

    /* events */
    if(action==="event:addOpen"){
      openModal(
        '<h2>イベントを追加</h2>'+
        '<form id="add-event-form">'+
          '<div class="field"><label>イベント名</label><input type="text" id="ae-name" required autofocus></div>'+
          '<div class="field"><label>集金金額（1人あたり）</label><div class="suffix-row"><input type="number" id="ae-amount" min="0" step="10" value="1000" required><span class="unit">円</span></div></div>'+
          '<button type="submit" class="btn">登録する</button>'+
        '</form>'
      );
      document.getElementById("add-event-form").addEventListener("submit", function(ev2){
        ev2.preventDefault();
        var name = document.getElementById("ae-name").value.trim();
        var amount = Number(document.getElementById("ae-amount").value);
        if(!name) return;
        var ev = addEvent(name, amount);
        closeModal();
        showToast(name+"を追加しました");
        ui.eventId = ev.id; ui.eventTab="participants";
        switchRoute("eventDetail");
      });
      return;
    }
    if(action==="event:open"){
      ui.eventId = Number(el.getAttribute("data-id"));
      ui.eventTab = "participants";
      switchRoute("eventDetail");
      return;
    }
    if(action==="event:tab"){ ui.eventTab = el.getAttribute("data-tab"); ui.eventSelected={}; render(); window.scrollTo(0,0); return; }
    if(action==="event:addMembersOpen"){
      var evx = getEvent(ui.eventId);
      var already = {}; evx.participants.forEach(function(p){ if(p.type==="member") already[p.memberId]=true; });
      var candidates = activeMembersAt(todayYm()).filter(function(m){ return !already[m.id]; });
      var listHtml = candidates.length===0 ? '<div class="empty-state">追加できるメンバーがいません</div>' :
        '<div class="checklist-scroll">' + candidates.map(function(m){
          return '<div class="list-item" data-pickmember="'+m.id+'"><span class="chk">✓</span><span class="nm">'+esc(m.name)+'</span></div>';
        }).join("") + '</div>';
      openModal(
        '<h2>参加者をメンバーから選ぶ</h2>'+
        listHtml +
        (candidates.length>0 ? '<button class="btn" id="add-members-confirm-btn">追加する</button>' : '')
      );
      var picked = {};
      document.querySelectorAll("[data-pickmember]").forEach(function(row){
        row.addEventListener("click", function(){
          var mid = Number(row.getAttribute("data-pickmember"));
          if(picked[mid]){ delete picked[mid]; row.classList.remove("checked"); }
          else { picked[mid]=true; row.classList.add("checked"); }
        });
      });
      var confirmBtn = document.getElementById("add-members-confirm-btn");
      if(confirmBtn){
        confirmBtn.addEventListener("click", function(){
          var ids = Object.keys(picked).map(Number);
          if(ids.length>0) eventAddMembers(ui.eventId, ids);
          closeModal();
          showToast(ids.length+"人を追加しました");
          render();
        });
      }
      return;
    }
    if(action==="event:addGuestOpen"){
      openModal(
        '<h2>ゲストを追加</h2>'+
        '<form id="add-guest-form">'+
          '<div class="field"><label>ゲスト名（空欄可）</label><input type="text" id="ag-name" placeholder="ゲスト'+state.nextGuestId+'"></div>'+
          '<button type="submit" class="btn">追加する</button>'+
        '</form>'
      );
      document.getElementById("add-guest-form").addEventListener("submit", function(ev2){
        ev2.preventDefault();
        var name = document.getElementById("ag-name").value;
        eventAddGuest(ui.eventId, name);
        closeModal();
        showToast("ゲストを追加しました");
        render();
      });
      return;
    }
    if(action==="event:removeParticipantConfirm"){
      var pid0 = Number(el.getAttribute("data-id"));
      var evr = getEvent(ui.eventId);
      var pobj = evr.participants.find(function(p){ return p.id===pid0; });
      var pname = pobj ? participantName(evr,pobj) : "";
      confirmModal(pname+"さんを参加者から削除しますか？", "支払い状況の記録も削除されます。", "削除する", true, function(){
        eventRemoveParticipant(ui.eventId, pid0);
        showToast("削除しました");
        render();
      });
      return;
    }
    if(action==="event:toggle"){
      var eid = Number(el.getAttribute("data-id"));
      if(ui.eventSelected[eid]) delete ui.eventSelected[eid]; else ui.eventSelected[eid]=true;
      render();
      return;
    }
    if(action==="event:selectAll"){
      var evu = getEvent(ui.eventId);
      eventUnpaidParticipants(evu).forEach(function(p){ ui.eventSelected[p.id]=true; });
      render();
      return;
    }
    if(action==="event:markPaid"){
      var ids2 = Object.keys(ui.eventSelected).map(Number);
      if(ids2.length===0) return;
      eventMarkPaid(ui.eventId, ids2);
      ui.eventSelected = {};
      showToast(ids2.length+"人を支払い済にしました");
      render();
      return;
    }
    if(action==="event:unmarkPaid"){
      var uid2 = Number(el.getAttribute("data-id"));
      eventUnmarkPaid(ui.eventId, uid2);
      render();
      return;
    }

    /* settings */
    if(action==="settings:export"){ doExport(); return; }
    if(action==="settings:importOpen"){ document.getElementById("import-file-input").click(); return; }
    if(action==="settings:resetConfirm"){
      confirmModal("すべてのデータを消去しますか？", "この操作は取り消せません。事前に「データを保存する」でバックアップすることをおすすめします。", "消去する", true, function(){
        state = defaultState();
        ensureYearsExist();
        saveState();
        showToast("データを消去しました");
        switchRoute("home");
      });
      return;
    }
  }

  /* fee form / practice form submit (delegated via change on content, forms re-created each render) */
  document.getElementById("content").addEventListener("submit", function(e){
    if(e.target && e.target.id === "practice-form"){
      e.preventDefault();
      var count = Number(document.getElementById("pf-count").value);
      var fee = Number(document.getElementById("pf-fee").value);
      setPracticeCount(ui.year, ui.month, count, fee);
      ui.monthEditing = false;
      showToast(MONTH_NAMES[ui.month-1]+"の集金額を設定しました");
      render();
    }
    if(e.target && e.target.id === "fee-form"){
      e.preventDefault();
      var v = Number(document.getElementById("fee-input").value);
      state.settings.feePerSession = v;
      saveState();
      showToast("保存しました");
    }
  });

  document.getElementById("content").addEventListener("input", function(e){
    if(e.target && (e.target.id==="pf-count" || e.target.id==="pf-fee")){
      var c = Number(document.getElementById("pf-count").value)||0;
      var f = Number(document.getElementById("pf-fee").value)||0;
      var prev = document.getElementById("pf-preview");
      if(prev) prev.innerHTML = '<div class="amt">'+fmtYen(c*f)+'</div><div class="lbl">1人あたりの集金額</div>';
    }
  });

  /* import file handling (delegated, element recreated each settings render) */
  document.addEventListener("change", function(e){
    if(e.target && e.target.id==="import-file-input"){
      var file = e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        var parsed;
        try{ parsed = JSON.parse(reader.result); }
        catch(err){ showToast("ファイルを読み込めませんでした"); return; }
        if(!parsed || typeof parsed !== "object" || !Array.isArray(parsed.members)){
          showToast("正しいデータファイルではありません");
          return;
        }
        confirmModal("データを引き継ぎますか？", "現在のこの端末のデータは、選択したファイルの内容で置き換えられます。", "引き継ぐ", true, function(){
          state = parsed;
          if(!state.settings) state.settings = {feePerSession:750};
          if(state.nextMemberId==null) state.nextMemberId = (state.members||[]).reduce(function(a,m){return Math.max(a,m.id+1);},1);
          if(state.nextEventId==null) state.nextEventId = (state.events||[]).reduce(function(a,ev){return Math.max(a,ev.id+1);},1);
          if(state.nextGuestId==null) state.nextGuestId = 1;
          if(state.nextParticipantId==null){
            var maxP = 1;
            (state.events||[]).forEach(function(ev){ (ev.participants||[]).forEach(function(p){ maxP = Math.max(maxP, p.id+1); }); });
            state.nextParticipantId = maxP;
          }
          ensureYearsExist();
          saveState();
          showToast("データを引き継ぎました");
          switchRoute("home");
        });
      };
      reader.readAsText(file);
      e.target.value = "";
    }
  });

  function doExport(){
    var json = JSON.stringify(state, null, 2);
    var today = todayYmd();
    var filename = "taikyoku_shukin_" + today + ".txt";

    function fallbackDownload(){
      try{
        var blob = new Blob([json], { type: "text/plain" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
        showToast("データを保存しました");
      }catch(e){
        showToast("保存に失敗しました");
      }
    }

    if(window.claude && window.claude.use){
      window.claude.use("downloads").then(function(downloads){
        if(downloads && downloads.save){
          downloads.save({ filename: filename, data: json }).then(function(){
            showToast("データを保存しました");
          }).catch(function(){
            fallbackDownload();
          });
        } else {
          fallbackDownload();
        }
      }).catch(function(){
        fallbackDownload();
      });
    } else {
      fallbackDownload();
    }
  }

  /* ---------- init ---------- */
  function init(){
    loadState();
    ensureYearsExist();
    saveState();
    render();
  }
  init();
})();
</script>
</body>
</html>
